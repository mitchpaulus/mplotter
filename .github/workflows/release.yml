name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version ${{ steps.version.outputs.version }}
        working-directory: App

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPlotter-${{ steps.version.outputs.version }}-setup
          path: App/installer/out/*.exe

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MPlotter ${{ steps.version.outputs.version }}" \
            --generate-notes \
            App/installer/out/*.exe
